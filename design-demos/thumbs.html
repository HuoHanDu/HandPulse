<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手脉 · 六个方向候选</title>
<style>
@font-face{font-family:'InterHP';src:url('assets/fonts/InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JBMonoHP';src:url('assets/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--sans:'InterHP',-apple-system,'SF Pro Display','Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif;--mono:'JBMonoHP',ui-monospace,'Cascadia Mono',monospace;--blue:#2997ff}
*{box-sizing:border-box}
html,body{margin:0;background:#0c0c0d;color:#f5f5f7;font-family:var(--sans)}
body{padding:34px 34px 44px}
.board-head{display:flex;align-items:baseline;gap:18px;margin-bottom:22px}
.board-head h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.board-head p{font-size:12px;color:#86868b;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,480px);gap:26px 26px}
.cell{margin:0}
.shot{width:480px;height:300px;overflow:hidden;position:relative;border-radius:10px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.mini{width:960px;height:600px;transform:scale(.5);transform-origin:0 0;position:absolute;inset:0;overflow:hidden}
figcaption{margin-top:10px;display:flex;gap:9px;align-items:baseline}
figcaption b{font-size:13px;font-weight:600;letter-spacing:-.01em}
figcaption span{font-size:11px;color:#86868b}
figcaption em{font-style:normal;font-family:var(--mono);font-size:10px;color:#2997ff}

/* ---------- 通用键盘 ---------- */
.kb{position:relative;margin:0 auto}
.kb .key{position:absolute;border-radius:2px;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:calc(var(--u)*.32);line-height:1;color:#cfd3da;overflow:hidden;
  transition:background .15s ease}
.kb .key[data-lv="4"],.kb .key[data-lv="5"]{color:#0b0e14}

/* ---------- 1 Gallery Dark ---------- */
.m-gallery{background:#000;color:#f5f5f7;display:flex}
.m-gallery .side{width:168px;padding:28px 20px 24px;display:flex;flex-direction:column}
.m-gallery .brand{font-size:15px;font-weight:600;letter-spacing:-.02em}
.m-gallery .brand span{font-size:9px;color:#2997ff;letter-spacing:.1em;margin-left:4px;font-family:var(--mono)}
.m-gallery nav{margin-top:40px;display:flex;flex-direction:column;gap:15px;font-size:13px;color:#7d7d82}
.m-gallery nav .on{color:#f5f5f7;position:relative}
.m-gallery nav .on:before{content:'';position:absolute;left:-12px;top:5px;width:4px;height:4px;border-radius:50%;background:#2997ff}
.m-gallery .foot{margin-top:auto}
.m-gallery .foot .n{font-size:32px;font-weight:600;letter-spacing:-.035em;font-family:var(--mono)}
.m-gallery .foot .l{font-size:9px;color:#7d7d82;margin-top:5px;letter-spacing:.06em}
.m-gallery .foot .st{display:flex;align-items:center;gap:6px;font-size:10px;color:#a1a1a6;margin-top:16px}
.m-gallery .foot .st i{width:6px;height:6px;border-radius:50%;background:#35d0a5;box-shadow:0 0 8px #35d0a5}
.m-gallery .main{flex:1;padding:36px 40px 0;min-width:0}
.m-gallery h1{font-size:38px;font-weight:600;letter-spacing:-.035em;margin:0}
.m-gallery .lead{font-size:14px;color:#a1a1a6;margin:9px 0 0;letter-spacing:-.01em}
.m-gallery .tools{display:flex;align-items:center;gap:16px;margin-top:20px;padding:10px 0;border-top:1px solid #1a1a1c;border-bottom:1px solid #1a1a1c;font-size:10px;color:#7d7d82}
.m-gallery .tools .grp{display:flex;align-items:center;gap:7px}
.m-gallery .tools .pill{background:#1a1a1c;border-radius:999px;padding:3px 9px;color:#f5f5f7}
.m-gallery .tools .spacer{margin-left:auto}
.m-gallery .stage{position:relative;width:540px;margin:26px auto 0;padding:24px 20px 28px;border-radius:14px;background:radial-gradient(120% 90% at 50% 0%,#15161a 0%,#0a0a0b 62%,#060607 100%)}
.m-gallery .stage:after{content:'';position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:400px;height:50px;background:radial-gradient(50% 50% at 50% 50%,rgba(76,141,255,.18),transparent 70%)}
.m-gallery .kb .key{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 rgba(0,0,0,.7);border-radius:3px}
.m-gallery .kb .key[data-lv="5"]{box-shadow:0 0 14px rgba(255,201,74,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.m-gallery .kb .key[data-lv="4"]{box-shadow:0 0 10px rgba(143,208,107,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.m-gallery .chips{display:flex;gap:6px;align-items:center;margin-top:34px;font-size:10px;color:#7d7d82}
.m-gallery .chips b{font-weight:500;color:#f5f5f7;background:#131316;border-radius:999px;padding:3px 8px;font-family:var(--mono);font-size:10px}

/* ---------- 2 Pro Instrument ---------- */
.m-pro{display:grid;grid-template-columns:46px 1fr 214px;background:#08090b;color:#e9eaec}
.m-pro .rail{background:#0b0c0e;border-right:1px solid #1e2025;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:14px}
.m-pro .rail .dot{width:20px;height:20px;border-radius:6px;background:#16181c;border:1px solid #26282e}
.m-pro .rail .on{background:#1a2740;border-color:#2f4f7d;box-shadow:0 0 0 1px #2997ff33}
.m-pro .rail .ico{font-size:8px;color:#7c7f86;line-height:1;margin-top:2px}
.m-pro .center{display:flex;flex-direction:column;min-width:0}
.m-pro .transport{height:32px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #1e2025;font-size:9px;color:#8d9096}
.m-pro .rec{display:flex;align-items:center;gap:5px;color:#c9cbd0}
.m-pro .rec i{width:5px;height:5px;border-radius:50%;background:#35d0a5;box-shadow:0 0 6px #35d0a5}
.m-pro .seg{display:flex;border:1px solid #2a2d33;border-radius:4px;overflow:hidden;margin-left:6px}
.m-pro .seg span{padding:3px 8px}
.m-pro .seg .on{background:#1a2740;color:#9cc0ff;box-shadow:inset 0 0 0 1px #2f4f7d}
.m-pro .spacer{margin-left:auto}
.m-pro .mono{font-family:var(--mono)}
.m-pro .head{display:flex;align-items:baseline;gap:12px;padding:14px 16px 6px}
.m-pro .head h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0}
.m-pro .head .sub{font-size:9px;color:#7c7f86;letter-spacing:.02em}
.m-pro .head .count{margin-left:auto;font-family:var(--mono);font-size:15px;color:#f0f0f2}
.m-pro .stick{height:22px;margin:4px 16px 8px;display:flex;gap:1px;align-items:flex-end;border-bottom:1px solid #1e2025;padding-bottom:2px}
.m-pro .stick i{flex:1;background:#2b4a74;border-radius:1px 1px 0 0}
.m-pro .stick i.hot{background:#d8b05a}
.m-pro .kbwrap{padding:2px 16px 0}
.m-pro .kb .key{background:#14161a;border:1px solid #24262c;border-radius:3px;color:#9da1a8;font-size:0}
.m-pro .kb .key[data-lv="0"]{background:#111318}
.m-pro .kb .key[data-lv="1"]{background:#16223a;border-color:#23344f}
.m-pro .kb .key[data-lv="2"]{background:#1d3654;border-color:#2b4a6b}
.m-pro .kb .key[data-lv="3"]{background:#2a5b7e;border-color:#3b7794}
.m-pro .kb .key[data-lv="4"]{background:#4c8f75;border-color:#5da88a}
.m-pro .kb .key[data-lv="5"]{background:#d8b05a;border-color:#e6c377;box-shadow:0 0 10px #d8b05a55}
.m-pro .legend{display:flex;gap:12px;align-items:center;padding:8px 16px;font-size:8px;color:#767a81;border-top:1px solid #1a1c21;margin-top:8px}
.m-pro .legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.m-pro .inspector{background:#0b0c0e;border-left:1px solid #1e2025;padding:12px 12px}
.m-pro .ins-top{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.m-pro .ins-top .k{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.m-pro .ins-top span{font-size:8px;color:#7c7f86}
.m-pro .ins-sub{font-size:8px;color:#7c7f86;margin-bottom:10px}
.m-pro .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid #17191d;font-size:8px;color:#8d9096}
.m-pro .row b{font-family:var(--mono);font-weight:400;color:#e9eaec;font-size:9px}
.m-pro .ins-note{margin-top:10px;font-size:8px;line-height:1.6;color:#767a81}

.m-pro .pro-table{margin:4px 16px 0;border-top:1px solid #1a1c21;padding-top:5px}
.m-pro .pt-head{display:flex;justify-content:space-between;font-size:7px;color:#6f737a;margin-bottom:2px}
.m-pro .pt-row{display:grid;grid-template-columns:40px 32px 32px 38px 1fr;gap:8px;align-items:center;font-size:8px;color:#9da1a8;padding:2px 0;font-family:var(--mono)}
.m-pro .pt-row i{height:2px;background:#1b1e24;border-radius:1px;overflow:hidden}
.m-pro .pt-row i b{display:block;height:100%;background:#4c8f75}
.m-pro .pro-lower{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin:10px 16px 0}
.m-pro .pro-lower h4{font-size:7px;font-weight:400;color:#6f737a;margin:0 0 5px;letter-spacing:.05em}
.m-pro .pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.m-pro .pl-grid div{display:flex;align-items:center;gap:6px;font-size:8px;padding:2px 0;border-bottom:1px solid #17191d;font-family:var(--mono)}
.m-pro .pl-grid b{color:#e9eaec;font-weight:400;width:34px}
.m-pro .pl-grid em{font-style:normal;color:#9da1a8;margin-left:auto}
.m-pro .pl-grid span{color:#6f737a;width:30px;text-align:right;font-size:7px}
.m-pro .bars{display:flex;align-items:flex-end;gap:2px;height:52px;border-bottom:1px solid #1e2025;padding-bottom:2px}
.m-pro .bars i{flex:1;background:#1f3a55;border-radius:1px 1px 0 0}
.m-pro .bars i.hot{background:#6a9a72}
/* ---------- 3 Liquid Glass ---------- */
.m-glass{position:relative;background:#040507;color:#fff;overflow:hidden}
.m-glass .amb{position:absolute;inset:0;background:
  radial-gradient(48% 42% at 50% 48%,rgba(76,141,255,.34),transparent 72%),
  radial-gradient(30% 26% at 66% 40%,rgba(53,208,165,.12),transparent 70%),
  radial-gradient(26% 22% at 38% 66%,rgba(255,201,74,.10),transparent 70%)}
.m-glass .kb-stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0}
.m-glass .kb-stage .kb{position:relative;opacity:.95}
.m-glass .kb-stage:after{content:"";position:absolute;inset:-16px -20px;border-radius:28px;background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(255,255,255,.02));backdrop-filter:blur(2.5px) saturate(180%);-webkit-backdrop-filter:blur(2.5px) saturate(180%);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 30px 70px rgba(0,0,0,.55)}
.m-glass .kb-stage .key{font-size:0;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.m-glass .nav{position:absolute;left:26px;top:26px;width:132px;padding:12px;border-radius:22px;
  background:rgba(255,255,255,.075);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 18px 40px rgba(0,0,0,.45)}
.m-glass .nav .b{font-size:12px;font-weight:600;letter-spacing:-.01em;padding:2px 6px 10px}
.m-glass .nav a{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#c7cbd4;text-decoration:none;padding:7px 8px;border-radius:12px}
.m-glass .nav a.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.m-glass .nav a em{font-style:normal;font-family:var(--mono);font-size:9px;color:#8f96a3}
.m-glass .float-tools{position:absolute;left:186px;top:26px;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:999px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);font-size:10px;color:#d6d9df}
.m-glass .float-tools .on{background:rgba(255,255,255,.9);color:#0a0a0c;border-radius:999px;padding:4px 10px;font-weight:600}
.m-glass .float-tools .d{width:1px;height:14px;background:rgba(255,255,255,.18)}
.m-glass .meter{position:absolute;right:26px;top:26px;width:158px;padding:12px 14px;border-radius:20px;
  background:rgba(255,255,255,.09);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 40px rgba(0,0,0,.4)}
.m-glass .meter .n{font-family:var(--mono);font-size:28px;letter-spacing:-.03em}
.m-glass .meter .l{font-size:9px;color:#aab1bd;margin-top:2px}
.m-glass .meter .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:9px;overflow:hidden}
.m-glass .meter .bar i{display:block;height:100%;width:66%;background:linear-gradient(90deg,#4c8dff,#8fd06b,#ffc94a)}
.m-glass .title{position:absolute;left:186px;top:92px;width:520px}
.m-glass .title h1{font-size:42px;font-weight:600;letter-spacing:-.035em;margin:0;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.m-glass .title p{font-size:12px;color:#b9c0cc;margin:8px 0 0}
.m-glass .panel{position:absolute;left:186px;right:26px;bottom:20px;height:172px;display:flex;gap:14px}
.m-glass .pane{background:rgba(255,255,255,.07);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.15);
  border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 24px 50px rgba(0,0,0,.42);padding:14px 16px}
.m-glass .pane.top{flex:1.5}
.m-glass .pane.side{flex:1}
.m-glass .pane h3{font-size:10px;font-weight:500;color:#aab1bd;margin:0 0 8px;letter-spacing:.04em}
.m-glass .pane .row{display:flex;align-items:center;gap:10px;font-size:10px;padding:5px 0}
.m-glass .pane .row b{font-family:var(--mono);font-weight:400;width:30px}
.m-glass .pane .row .track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.m-glass .pane .row .track i{display:block;height:100%;border-radius:2px;background:rgba(255,255,255,.7)}
.m-glass .pane .row em{font-style:normal;font-family:var(--mono);font-size:9px;color:#aab1bd;width:44px;text-align:right}

/* ---------- 4 Light Gallery ---------- */
.m-light{background:#fff;color:#1d1d1f;display:flex}
.m-light .side{width:168px;background:#f5f5f7;padding:28px 20px 24px;display:flex;flex-direction:column;border-right:1px solid #e8e8ed}
.m-light .brand{font-size:15px;font-weight:600;letter-spacing:-.02em}
.m-light .brand span{font-size:9px;color:#0066cc;margin-left:4px;font-family:var(--mono);letter-spacing:.08em}
.m-light nav{display:flex;flex-direction:column;gap:15px;margin-top:40px;font-size:13px;color:#7a7a7e}
.m-light nav .on{color:#1d1d1f}
.m-light .foot{margin-top:auto}
.m-light .foot .n{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.035em}
.m-light .foot .l{font-size:9px;color:#7a7a7e;margin-top:5px;letter-spacing:.05em}
.m-light .main{flex:1;padding:36px 40px 0;min-width:0}
.m-light h1{font-size:40px;font-weight:600;letter-spacing:-.035em;margin:0}
.m-light .lead{font-size:14px;color:#6e6e73;margin:9px 0 0}
.m-light .tools{display:flex;align-items:center;gap:14px;margin-top:20px;padding:10px 0;border-top:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0;font-size:10px;color:#7a7a7e}
.m-light .tools .pill{background:#1d1d1f;color:#fff;border-radius:999px;padding:3px 9px}
.m-light .tools .spacer{margin-left:auto}
.m-light .stage{width:540px;margin:28px auto 0;padding:24px 20px 28px;border-radius:18px;background:#fff;border:1px solid #ededf0;box-shadow:0 3px 5px 30px rgba(0,0,0,.08)}
.m-light .kb .key{background:#f2f2f4;color:#4a4a4f;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06),0 1px 0 rgba(0,0,0,.05);border-radius:3px}
.m-light .kb .key[data-lv="4"],.m-light .kb .key[data-lv="5"]{color:#fff}
.m-light .chips{display:flex;gap:6px;margin-top:30px;font-size:10px;color:#7a7a7e}
.m-light .chips b{font-family:var(--mono);font-weight:400;color:#1d1d1f;background:#f5f5f7;border-radius:999px;padding:3px 8px}

/* ---------- 5 Health Dark ---------- */
.m-health{background:#000;color:#fff;padding:0}
.m-health .top{height:46px;display:flex;align-items:center;gap:20px;padding:0 26px;border-bottom:1px solid #1c1c1e}
.m-health .top .b{font-size:13px;font-weight:600}
.m-health .top nav{display:flex;gap:16px;font-size:10px;color:#8e8e93}
.m-health .top nav .on{color:#fff}
.m-health .top .t{margin-left:auto;font-family:var(--mono);font-size:10px;color:#8e8e93}
.m-health .hero{padding:20px 30px 14px;display:flex;align-items:flex-end;gap:16px}
.m-health .hero .n{font-size:56px;font-weight:700;letter-spacing:-.045em;line-height:1;font-family:var(--sans)}
.m-health .hero .cap{font-size:10px;color:#8e8e93;padding-bottom:6px}
.m-health .grid{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:12px;padding:0 20px}
.m-health .card{background:#1c1c1e;border-radius:16px;padding:14px}
.m-health .card h3{font-size:9px;font-weight:500;color:#8e8e93;margin:0 0 10px;letter-spacing:.03em}
.m-health .card .big{font-family:var(--mono);font-size:24px;letter-spacing:-.03em}
.m-health .card .small{font-size:9px;color:#8e8e93;margin-top:3px}
.m-health .kb .key{background:#2c2c2e;border-radius:4px;color:#aeaeb2;font-size:0}
.m-health .card.wide{padding:12px 12px}
.m-health .card.wide .kb{margin-top:2px}
.m-health .status{display:flex;align-items:center;gap:5px;font-size:9px;color:#8e8e93;margin-top:8px}
.m-health .status i{width:5px;height:5px;border-radius:50%;background:#35d0a5}

.m-health .grid.row2{margin-top:12px;grid-template-columns:1.55fr 1fr 1fr}
.m-health .bars24{display:flex;align-items:flex-end;gap:2px;height:52px;border-bottom:1px solid #2c2c2e;padding-bottom:2px}
.m-health .bars24 i{flex:1;background:#3a3a3c;border-radius:1px 1px 0 0}
.m-health .bars24 i.hot{background:#35d0a5}
/* ---------- 6 Type Monument ---------- */
.m-type{background:#000;color:#fff;padding:26px 36px;position:relative}
.m-type .top{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;color:#8b8b90;letter-spacing:.04em}
.m-type .top .l{color:#fff;font-weight:600;font-size:12px;letter-spacing:-.01em}
.m-type .num{font-size:152px;font-weight:600;letter-spacing:-.07em;line-height:.86;margin-top:14px}
.m-type .cap{font-size:12px;color:#8b8b90;margin-top:8px;letter-spacing:.02em}
.m-type .cap b{color:#2997ff;font-weight:500}
.m-type .kbwrap{margin-top:20px;opacity:.9}
.m-type .kb .key{background:#151517;border-radius:1px;font-size:0}
.m-type .kb .key[data-lv="5"]{background:#f5f5f7}
.m-type .kb .key[data-lv="4"]{background:#8a8a8f}
.m-type .kb .key[data-lv="3"]{background:#3e3e42}
.m-type .kb .key[data-lv="2"]{background:#262629}
.m-type .line{margin-top:16px;padding-top:10px;border-top:1px solid #1d1d1f;display:flex;gap:18px;font-family:var(--mono);font-size:9px;color:#8b8b90}
.m-type .line b{color:#f5f5f7;font-weight:400}
.m-type .foot{position:absolute;right:36px;bottom:24px;text-align:right;font-size:9px;color:#5f5f63;line-height:1.7}
</style>
</head>
<body>
<div class="board-head">
  <h1>手脉 · 六个方向候选</h1>
  <p>同一屏（键盘 / 今日）的六种骨架 · 480×300 缩略 · 数据同一份</p>
</div>

<div class="grid">

<!-- 1 Gallery Dark -->
<figure class="cell">
  <div class="shot">

<script>
(function(){
  var MAX = 1204;
  var THEMES = {
    gallery: ['#131316','#16283c','#1d4767','#2b7a92','#66b98a','#e9c25c'],
    pro:     ['#111318','#16223a','#1d3654','#2a5b7e','#4c8f75','#d8b05a'],
    glass:   ['rgba(255,255,255,.09)','rgba(76,141,255,.42)','rgba(70,150,200,.52)','rgba(80,180,180,.58)','rgba(150,205,120,.66)','rgba(255,205,90,.82)'],
    light:   ['#f2f2f4','#dbe9fb','#b9d8f8','#7fb4e8','#4a8ecb','#1e5f9e'],
    health:  ['#2c2c2e','#20344a','#22506b','#2f7f86','#5da86b','#e6c34a'],
    type:    ['#151517','#1d1d20','#2a2a2e','#3e3e42','#8a8a8f','#f5f5f7']
  };
  function lv(c){
    if (c >= 1200) return 5;
    if (c >= 900) return 4;
    if (c >= 700) return 3;
    if (c >= 300) return 2;
    if (c > 0) return 1;
    return 0;
  }
  document.querySelectorAll('.kb').forEach(function(el){
    var u = parseFloat(el.dataset.u || 16);
    var theme = el.dataset.theme || 'gallery';
    var pal = THEMES[theme];
    el.style.setProperty('--u', u + 'px');
    el.style.width = (24 * u) + 'px';
    el.style.height = (6 * u) + 'px';
    HP.keyboard.keys.forEach(function(k){
      var d = document.createElement('div');
      var l = lv(k.count);
      d.className = 'key';
      d.dataset.lv = l;
      d.style.left = (k.x * u) + 'px';
      d.style.top = (k.y * u) + 'px';
      d.style.width = Math.max(2, k.w * u - 2) + 'px';
      d.style.height = Math.max(2, k.h * u - 2) + 'px';
      d.style.background = pal[l];
      el.appendChild(d);
    });
  });
  // Pro 的 24 小时柱 / Health 的 24 小时柱
  var bars = document.getElementById('proBars');
  if (bars) {
    var mxh = Math.max.apply(null, HP.keyHour);
    HP.keyHour.forEach(function(v){
      var b = document.createElement('i');
      b.style.height = Math.max(1, Math.round(v / mxh * 50)) + 'px';
      if (v > mxh * 0.6) b.className = 'hot';
      bars.appendChild(b);
    });
  }
  var hbars = document.getElementById('healthBars');
  if (hbars) {
    var mx2 = Math.max.apply(null, HP.keyHour);
    HP.keyHour.forEach(function(v){
      var b = document.createElement('i');
      b.style.height = Math.max(1, Math.round(v / mx2 * 50)) + 'px';
      if (v > mx2 * 0.6) b.className = 'hot';
      hbars.appendChild(b);
    });
  }
  // Pro 的时间轴：60 根柱子，按真实分钟数据
  var stick = document.querySelector('.m-pro .stick');
  if (stick) {
    var arr = HP.perMinute.keys.slice(21 * 60 + 40, 21 * 60 + 43 + 1);
    var base = HP.perMinute.keys.slice(21 * 60 - 57, 21 * 60 + 43 + 1).filter(function(v){ return v != null; });
    var mx = Math.max.apply(null, base) || 1;
    for (var i = 0; i < 60; i++) {
      var v = base[Math.max(0, base.length - 60 + i)] || 0;
      var bar = document.createElement('i');
      bar.style.height = Math.max(2, Math.round(v / mx * 20)) + 'px';
      if (v > mx * 0.7) bar.className = 'hot';
      stick.appendChild(bar);
    }
  }
})();
</script>
