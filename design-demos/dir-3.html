<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>手脉 HandPulse</title>
<style>
@font-face{font-family:"Inter Variable";src:url("assets/fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}

:root{
  --bg:#05070B; --bg2:#080B12;
  --ink:#EDF3FB; --ink2:#B3C0D0; --ink3:#94A2B5;
  --blue:#5AA2FF; --blue2:#2997FF;
  --ok:#35D0A5;
  --h0:#16202E; --h1:#1D3F6B; --h2:#2A6FA8; --h3:#46A6C4; --h4:#8FD06B; --h5:#FFC94A;
  --line:rgba(255,255,255,.09);
  --glass:linear-gradient(158deg, rgba(32,41,56,.74) 0%, rgba(10,14,21,.85) 62%, rgba(7,10,16,.88) 100%);
  --glass-b:1px solid rgba(255,255,255,.13);
  --rim:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.36);
  --drop:0 26px 50px -34px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);}
body{
  font-family:"Inter Variable","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;font-feature-settings:"cv11";
}
button{font-family:inherit;color:inherit}
h1,h2{margin:0;font-weight:600}
p{margin:0}
.mono{font-family:"JetBrains Mono","Noto Sans SC",monospace;font-variant-numeric:tabular-nums;font-feature-settings:"zero"}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
::selection{background:rgba(41,151,255,.35)}

/* ------- stage ------- */
#stage{
  position:absolute;left:50%;top:50%;width:1440px;height:900px;
  transform:translate(-50%,-50%) scale(var(--s,1));
  overflow:hidden;background:
    radial-gradient(120% 90% at 72% 88%, rgba(22,32,46,.55) 0%, rgba(5,7,11,0) 70%),
    linear-gradient(180deg,#05070B 0%,#060910 55%,#04060A 100%);
}
#glow{position:absolute;inset:0;width:1440px;height:900px;z-index:1;pointer-events:none;transition:opacity .3s ease}body:not([data-route="keyboard"]) #glow{opacity:.5}
#field{position:absolute;z-index:4;transition:opacity .34s ease,filter .34s ease}
body:not([data-route="keyboard"]) #field{opacity:0;visibility:hidden;pointer-events:none}body.paused #field{opacity:.45;filter:saturate(.55) brightness(.9)}

/* ------- glass ------- */
.glass{
  background:var(--glass);border:var(--glass-b);border-radius:28px;
  box-shadow:var(--rim),var(--drop);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  backdrop-filter:blur(26px) saturate(165%);
  transition:border-color .18s ease, box-shadow .18s ease;
}
.glass.rim{border-color:rgba(190,220,255,.30)}
.glass.rim{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.36),0 26px 50px -34px rgba(0,0,0,.95)}

/* ------- nav ------- */
.nav{position:absolute;left:28px;top:32px;width:148px;padding:8px;border-radius:26px;z-index:22;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:8px;right:8px;top:50px;height:48px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.09));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.2);
  transition:transform .18s cubic-bezier(.22,.8,.24,1);pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;height:40px;padding:0 11px;position:relative;z-index:1}.brand .dot{animation:breathe 2.8s ease-in-out infinite}body.paused .brand .dot,body.cleared .brand .dot{animation:none}.st-row .dot{animation:breathe 2.8s ease-in-out infinite}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(53,208,165,.13);flex:none}
body.paused .dot,body.cleared .dot{background:#8C99AA;box-shadow:0 0 0 4px rgba(140,153,170,.10)}
.nav .item{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
  height:48px;padding:0 12px;border-radius:16px;color:var(--ink2);font-size:14px;text-decoration:none;
  transition:color .18s ease;background:none;border:0;cursor:pointer;width:100%;text-align:left}
.nav .item:hover{color:var(--ink)}
.nav .item[aria-current="page"]{color:#fff}
.nav .rd{font-size:12px;color:var(--ink3);letter-spacing:0}
.nav .item[aria-current="page"] .rd{color:#D3E4F8}
.nav .foot{padding:10px 12px 4px;font-size:12px;color:var(--ink3);position:relative;z-index:1}

/* ------- header ------- */
.head{position:absolute;left:204px;top:38px;z-index:14;max-width:560px}
.head h1{font-size:30px;line-height:1.12;letter-spacing:-.028em}
.head .sub{margin-top:7px;font-size:14px;color:var(--ink3);letter-spacing:-.005em}

/* ------- top capsule ------- */
.capsule{position:absolute;right:24px;top:32px;width:400px;height:84px;z-index:21;
  display:flex;align-items:center;gap:18px;padding:0 16px 0 20px;border-radius:24px}
.cap-blk{display:flex;flex-direction:column;gap:3px}.cap-blk:first-child{min-width:116px}
.cap-lab{font-size:12px;color:var(--ink3)}
.cap-val{font-size:25px;line-height:1;letter-spacing:-.02em;font-weight:500}
.cap-val.sm{font-size:18px;font-weight:500}
.cap-sub{font-size:12px;color:var(--ink3)}
.cap-div{width:1px;height:38px;background:var(--line)}
.pause{margin-left:auto;height:38px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.17);
  background:rgba(255,255,255,.07);font-size:13px;cursor:pointer;color:var(--ink);transition:background .18s,transform .12s}
.pause:hover{background:rgba(255,255,255,.13)}
.pause:active{transform:scale(.96)}
body.paused .pause{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}

/* ------- toolbar ------- */
.toolbar{position:absolute;left:204px;top:136px;height:56px;z-index:16;display:flex;align-items:center;
  gap:22px;padding:0 16px;border-radius:18px;width:auto}
.toolbar.wide{width:1212px}
.seg{display:flex;align-items:center;gap:9px}
.seg-lab{font-size:12px;color:var(--ink3);white-space:nowrap}
.seg-btns{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.seg-btn{height:36px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--ink2);
  font-size:13px;cursor:pointer;white-space:nowrap;transition:background .16s,color .16s}
.seg-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.seg-btn.is-on{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.11));color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 1px 0 rgba(0,0,0,.2)}
.ghost{height:36px;padding:0 15px;border-radius:999px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;
  transition:background .16s,transform .12s}
.ghost:hover{background:rgba(255,255,255,.11)}
.ghost:active{transform:scale(.97)}
.ghost.sm{height:32px;padding:0 12px;font-size:12px}
.tb-note{font-size:12px;color:var(--ink3);white-space:nowrap}
.tb-sp{flex:1}

/* ------- rail pills ------- */
.rail{position:absolute;left:204px;top:214px;z-index:15;display:flex;gap:12px}
.rpill{display:flex;align-items:baseline;gap:8px;height:64px;padding:0 20px;border-radius:22px}
.rpill .k{font-size:12px;color:var(--ink3)}
.rpill .v{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
.rpill .u{font-size:12px;color:var(--ink3)}

/* ------- panels ------- */
.panel{position:absolute;z-index:17;border-radius:24px;padding:14px 16px 16px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;height:26px}
.panel-h h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel-h .meta{font-size:12px;color:var(--ink3);white-space:nowrap}
.sum{font-size:14px;color:var(--ink2);margin:6px 0 8px;line-height:1.5}

/* ------- keyboard page ------- */
.kb{position:absolute;inset:0;z-index:3;pointer-events:none}
.key{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid rgba(255,255,255,.07);cursor:pointer;overflow:hidden;
  transition:background .18s ease,color .18s ease,box-shadow .16s ease,transform .12s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);pointer-events:auto}
.key b{font-family:"JetBrains Mono","Noto Sans SC",monospace;font-size:12.5px;font-weight:500;line-height:1;letter-spacing:-.01em}
.key i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1;margin-top:3px;opacity:.92}
.key i:empty{display:none}
.key.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1.5px rgba(240,250,255,.92),0 0 34px 4px rgba(120,200,255,.5);transform:translateY(1px) scale(.975);z-index:3}
.key.sel{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px rgba(90,162,255,.95),0 0 26px 2px rgba(41,151,255,.4);z-index:2}
@keyframes ping{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 0 rgba(255,255,255,.0)}45%{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px rgba(240,250,255,.9),0 0 30px 4px rgba(160,220,255,.55)}}
.key.ping{animation:ping .26s ease-out 3}
body:not([data-route="keyboard"]) .key{pointer-events:none}

.top10{left:1126px;top:168px;width:290px}
.tlist{display:flex;flex-direction:column;margin-top:8px}
.trow{display:grid;grid-template-columns:42px 1fr 46px 40px;align-items:center;gap:9px;height:36px;width:100%;
  background:none;border:0;padding:0;cursor:pointer;border-radius:9px;text-align:left}
.trow:hover{background:rgba(255,255,255,.06)}
.trow .tk{font-size:12px;color:var(--ink);text-align:center}
.trow .tbar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.trow .tbar i{display:block;height:100%;border-radius:4px}
.trow .tc{font-size:13px;text-align:right;color:var(--ink)}
.trow .tp{font-size:12px;text-align:right;color:var(--ink3)}

.status{left:1126px;top:760px;width:290px;height:84px;padding:12px 16px}
.status .panel-h{height:20px}
.st-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.st-line{font-size:12px;color:var(--ink3);margin-top:4px}

.dock{position:absolute;left:102px;top:760px;width:1008px;height:84px;z-index:18;border-radius:30px;
  display:flex;align-items:center;gap:16px;padding:0 20px}
.dock-lab{font-size:12px;color:var(--ink3);white-space:nowrap}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);cursor:pointer;
  transition:background .16s,transform .12s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip:active{transform:scale(.97)}
.chip span{font-size:13px;color:var(--ink)}
.chip em{font-style:normal;font-size:12px;color:var(--ink3)}
.dock-live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:12px}
.dock-live b{font-size:14px;color:var(--ink);font-weight:500}
.dock-live .dot{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* ------- popover ------- */
.pop{position:absolute;z-index:60;width:252px;padding:14px 15px 12px;border-radius:20px;
  display:none;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop[data-open="1"]{display:block}
.pop-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.pop-h b{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500;letter-spacing:-.01em}
.pop-h span{font-size:12px;color:var(--ink3)}
.pop dl{margin:0;display:grid;grid-template-columns:1fr auto;row-gap:7px}
.pop dt{font-size:12px;color:var(--ink3)}
.pop dd{margin:0;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.pop .pop-tip{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}

/* ------- banner / toast ------- */
.banner{position:absolute;left:620px;top:22px;width:360px;height:52px;z-index:55;border-radius:20px;
  display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;font-size:13px}
.banner[hidden]{display:none}
.banner .ghost{margin-left:auto}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;padding:12px 18px;
  border-radius:999px;font-size:13px;color:var(--ink);max-width:640px;white-space:nowrap}
.toast[hidden]{display:none}

/* ------- empty ------- */
.empty{position:absolute;z-index:19;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:16px 24px;border-radius:999px;font-size:14px;color:var(--ink);display:none;white-space:nowrap}
.empty[data-on="1"]{display:block}
.empty-kb{left:606px;top:526px}
body[data-route="keyboard"] .empty-kb[data-on="1"]{display:block}

/* ------- mouse page ------- */
.gridPanel{left:204px;top:212px;width:768px;height:486px}
.gridHead{display:flex;align-items:center;justify-content:space-between;height:30px}
.gridHead .gh{font-size:14px;font-weight:600}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.legend i{width:14px;height:9px;border-radius:2px;display:block}
.cellgrid{position:relative;margin-top:10px;width:740px;height:416px;border:1px dashed rgba(255,255,255,.42);border-radius:6px;
  display:grid;grid-template-columns:repeat(32,1fr);grid-template-rows:repeat(18,1fr);gap:1px;padding:2px}
.cell{position:relative;border-radius:2px;background:var(--h0);display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1;color:#DCE8F6;transition:background .18s ease,box-shadow .16s ease}
.cell[data-v="0"]{color:transparent;background:rgba(255,255,255,.028)}
.cell.hot{color:#0A1119}
.cell.ping{box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 18px 2px rgba(160,220,255,.45);z-index:2}
.metrics{left:988px;top:212px;width:428px;height:486px;padding:16px 18px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:8px}
.metric{padding:20px 0 16px;border-top:1px solid var(--line)}
.metric:nth-child(-n+2){border-top:0}
.metric .ml{font-size:12px;color:var(--ink3)}
.metric .mv{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:5px;line-height:1}
.metric .mv small{font-family:"Inter Variable","Noto Sans SC",sans-serif;font-size:12px;color:var(--ink3);margin-left:5px;letter-spacing:0;font-weight:400}
.mouseFig{position:absolute;left:204px;top:708px;width:360px;height:164px;z-index:15}
.wheelPanel{left:580px;top:708px;width:420px;height:164px;padding:14px 18px}
.wheelRow{display:flex;align-items:center;gap:22px;margin-top:4px}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.spark i{flex:1;display:block;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#46A6C4,#1D3F6B)}
.spark-cap{font-size:12px;color:var(--ink3);margin-top:4px}
.wheelCol{display:flex;flex-direction:column;gap:6px;min-width:96px}
.wheelCol .wl{font-size:12px;color:var(--ink3)}
.wheelCol .wv{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1}
.wbar{position:relative;width:150px;height:44px}
.wbar .up,.wbar .dn{position:absolute;left:0;height:16px;border-radius:3px;background:linear-gradient(90deg,#2A6FA8,#46A6C4)}
.wbar .up{top:4px}.wbar .dn{bottom:4px;background:linear-gradient(90deg,#1D3F6B,#2A6FA8)}
.wbar .ax{position:absolute;left:0;right:0;top:22px;height:1px;background:rgba(255,255,255,.14)}
.notePanel{left:1016px;top:708px;width:400px;height:164px;padding:14px 18px}
.notePanel p{font-size:14px;line-height:1.55;color:var(--ink2);margin-top:8px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  font-size:12px;color:var(--ink3);margin-top:10px}

/* ------- stats page ------- */
.lineWrap{left:204px;top:212px;width:780px;height:328px;padding:14px 18px 10px}
.chartbox{position:relative;width:744px;height:246px;margin-top:2px}
.chartbox svg{display:block;overflow:visible}
.tip{position:absolute;z-index:5;padding:9px 11px;border-radius:12px;background:rgba(14,19,28,.92);
  border:1px solid rgba(255,255,255,.16);font-size:12px;color:var(--ink);pointer-events:none;display:none;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.9);white-space:nowrap}
.tip b{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;margin-left:6px}
.histWrap{left:1000px;top:212px;width:416px;height:328px;padding:12px 14px}
.histTabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);width:max-content}
.histTabs button{height:30px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-size:12px;cursor:pointer;white-space:nowrap}
.histTabs button.is-on{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.11));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.histBody{margin-top:10px;height:252px;overflow:hidden}
.top20{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.to20row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:7px;height:22px}
.to20row .k{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink2)}
.to20row .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.to20row .bar i{display:block;height:100%}
.to20row .v{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink3);text-align:right}
.hbars{display:flex;align-items:flex-end;gap:5px;height:210px;margin-top:14px}
.hb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.hb .b{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#5AA2FF,#2A6FA8)}
.hb .lb{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink3)}
.gapWrap{margin-top:12px;position:relative;height:216px;padding-left:46px}
.gapWrap .gl{position:absolute;left:46px;right:0;height:1px;background:rgba(255,255,255,.07)}
.gapWrap .gl span{position:absolute;left:-42px;top:-7px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink3)}
.gapBars{position:absolute;left:46px;right:0;bottom:22px;top:0;display:flex;align-items:flex-end;gap:14px}
.gapBar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.gapBar .b{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#46A6C4,#1D3F6B)}
.gapBar .n{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink2)}
.gapX{position:absolute;left:46px;right:0;bottom:0;display:flex;gap:14px}
.gapX span{flex:1;text-align:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink3)}
.heatWrap{left:204px;top:556px;width:780px;height:312px;padding:12px 18px}
.heatGrid{margin-top:8px;display:grid;grid-template-columns:32px repeat(24,1fr);gap:3px}
.heatGrid .rl{font-family:"JetBrains Mono",monospace;font-size:12px;color:#AAB7C8;line-height:16px}
.heatGrid i{height:16px;border-radius:3px;display:block;transition:box-shadow .12s}
.heatGrid i:hover{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.calWrap{margin-top:6px;position:relative;height:196px}
.calGrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;margin-left:34px}
.calGrid i{width:10px;height:11px;border-radius:2px;display:block}

  rows.forEach(function (r) { var v = Math.round(r.c / totalC * totalCm); r.move = v; acc += v; });
  if (rows.length) rows[rows.length - 1].move += totalCm - acc;
  rows.reverse();
  TROWS = rows;
  return rows;
}
function tableHTML() {
  var rows = tableRows();
  if (S.cleared) return '<p class="sum" style="margin-top:20px">还没有数据，先在键盘/鼠标页敲几下。</p>';
  var per = 50, pages = Math.max(1, Math.ceil(rows.length / per));
  if (S.page >= pages) S.page = 0;
  var slice = rows.slice(S.page * per, S.page * per + 8);
  return '<table class="tbl"><thead><tr><th>时间</th><th>动作</th><th>按键</th><th>点击</th><th>移动 cm</th></tr></thead><tbody>' +
    slice.map(function (r) {
      return '<tr><td>' + HP.fmt.min(r.m) + '</td><td>' + r.a + '</td><td>' + r.k + '</td><td>' + r.c + '</td><td>' + fmt(r.move) + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<div class="pager"><button type="button" class="ghost" data-act="prev">上一页</button>' +
    '<button type="button" class="ghost" data-act="next">下一页</button>' +
    '<span class="pinfo">第 ' + (S.page + 1) + ' / ' + pages + ' 页　每页 50 行</span></div>';
}
function mountStats() {
  renderLine();
  var csv = $('#csvBtn');
  if (csv) csv.addEventListener('click', function () { toast('导出占位：原型不写文件，筛选范围内共 ' + tableRows().length + ' 行'); });
}
function renderLine() {
  var box = $('#lineBox'); if (!box) return;
  var W = box.clientWidth || 744, H = box.clientHeight || 246;
  var d = lineData();
  var pad = { l: 48, r: 14, t: 18, b: 26 }, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var n = d.vals.length, max = 0, peak = -1;
  d.vals.forEach(function (v, i) { if (v != null && v > max) { max = v; peak = i; } });
  var ymax = niceMax(max || 1);
  function X(i) { return pad.l + (n > 1 ? i / (n - 1) : 0) * iw; }
  function Y(v) { return pad.t + ih - (v / ymax) * ih; }
  var path = '', area = '', started = false, pts = [];
  for (var i = 0; i < n; i++) {
    var v = d.vals[i];
    if (v == null) continue;
    pts.push([X(i), Y(v)]);
    path += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    started = true;
  }
  if (pts.length) area = 'M' + pts[0][0].toFixed(1) + ' ' + (pad.t + ih) + ' ' + path.replace(/^M/, 'L') + 'L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (pad.t + ih) + ' Z';
  var grid = '', gl;
  for (var g = 0; g <= 4; g++) {
    var yy = pad.t + ih - (g / 4) * ih;
    grid += '<line x1="' + pad.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(1) + '" stroke="rgba(255,255,255,' + (g === 0 ? 0.18 : 0.07) + ')"/>';
    grid += '<text x="' + (pad.l - 8) + '" y="' + (yy + 4).toFixed(1) + '" font-size="12" fill="#A9B7C9" text-anchor="end" font-family="JetBrains Mono, monospace">' + fmt(Math.round(ymax * g / 4)) + '</text>';
  }
  var ticks = d.ticks.map(function (t) {
    return '<text x="' + X(t.i).toFixed(1) + '" y="' + (H - 6) + '" font-size="12" fill="#A9B7C9" text-anchor="middle" font-family="JetBrains Mono, monospace">' + t.t + '</text>';
  }).join('');
  var peakMark = '';
  if (peak >= 0) {
    var px = X(peak), py = Y(d.vals[peak]);
    var lbl = S.srange === 'today' ? HP.fmt.min(peak) : S.srange === '7d' ? HP.week.labels[peak] : HP.days30[peak].date;
    var tx = Math.min(W - pad.r - 8, Math.max(pad.l + 30, px));
    peakMark = '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="3.4" fill="#EDF3FB"/>' +
      '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="9" fill="rgba(90,162,255,.22)"/>' +
      '<text x="' + tx.toFixed(1) + '" y="' + (py - 12).toFixed(1) + '" font-size="12" fill="#EDF3FB" text-anchor="middle" font-family="JetBrains Mono, monospace">' + fmt(max) + '　' + lbl + '</text>';
  }
  if (!pts.length) {
    peakMark = '<text x="' + (pad.l + iw / 2) + '" y="' + (pad.t + ih / 2) + '" font-size="13" fill="#A9B7C9" text-anchor="middle">该时段无记录</text>';
  }
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#5AA2FF" stop-opacity="0.34"/><stop offset="1" stop-color="#5AA2FF" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    (area ? '<path d="' + area + '" fill="url(#ag)"/>' : '') +
    (path ? '<path d="' + path + '" fill="none" stroke="#7CB8FF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
    peakMark + ticks +
    '<g id="xh" style="display:none"><line stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3" y1="' + pad.t + '" y2="' + (pad.t + ih) + '"/>' +
    '<circle r="3.6" fill="#fff"/></g>' +
    '</svg><div class="tip" id="lineTip"></div>';
  box.innerHTML = svg;
  var svgEl = box.querySelector('svg'), xh = box.querySelector('#xh'), tip = box.querySelector('#lineTip');
  var xline = xh.querySelector('line'), xdot = xh.querySelector('circle');
  box.addEventListener('mousemove', function (e) {
    var r = box.getBoundingClientRect();
    var mx = e.clientX - r.left;
    if (mx < pad.l || mx > W - pad.r) { xh.style.display = 'none'; tip.style.display = 'none'; return; }
    var idx = Math.round((mx - pad.l) / iw * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    var vv = d.vals[idx];
    if (vv == null) { xh.style.display = 'none'; tip.style.display = 'none'; return; }
    var px = X(idx), py = Y(vv);
    xh.style.display = '';
    xline.setAttribute('x1', px); xline.setAttribute('x2', px);
    xdot.setAttribute('cx', px); xdot.setAttribute('cy', py);
    var lbl = S.srange === 'today' ? HP.fmt.min(idx) : S.srange === '7d' ? HP.week.labels[idx] : HP.days30[idx].date;
    tip.style.display = 'block';
    tip.innerHTML = lbl + '<b>' + fmt(vv) + '</b> ' + d.unit;
    tip.style.left = Math.min(W - 150, Math.max(0, px + 12)) + 'px';
    tip.style.top = Math.max(0, py - 40) + 'px';
  });
  box.addEventListener('mouseleave', function () { xh.style.display = 'none'; tip.style.display = 'none'; });
}

/* ---------------- settings ---------------- */
function viewSettings() {
  return '' +
    '<div class="group glass" style="left:204px;top:212px;width:600px">' +
      '<div class="gh2">采集</div>' +
      '<div class="srow"><div><div class="sl">采集总开关</div><div class="sd">关闭后立即停止写入，已有数据保留</div></div>' +
        '<div class="sc"><button type="button" class="switch" role="switch" aria-checked="' + (S.capture ? 'true' : 'false') + '" data-sw="capture" aria-label="采集总开关"></button></div></div>' +
      '<div class="srow"><div><div class="sl">桶粒度</div><div class="sd">每 ' + S.bucket + ' 秒落一个数据桶</div></div>' +
        '<div class="sc"><div class="seg2">' + [10, 30, 60].map(function (b) {
          return '<button type="button" data-opt="bucket" data-v="' + b + '"' + (S.bucket === b ? ' class="is-on"' : '') + '>' + b + ' s</button>';
        }).join('') + '</div></div></div>' +
      '<div class="srow"><div><div class="sl">开机自启</div><div class="sd">登录 Windows 后自动开始记录</div></div>' +
        '<div class="sc"><button type="button" class="switch" role="switch" aria-checked="' + (S.autostart ? 'true' : 'false') + '" data-sw="autostart" aria-label="开机自启"></button></div></div>' +
    '</div>' +
    '<div class="group glass" style="left:204px;top:458px;width:600px">' +
      '<div class="gh2">数据</div>' +
      '<div class="srow"><div><div class="sl">数据保留</div><div class="sd">超过保留期的数据自动清理</div></div>' +
        '<div class="sc"><div class="seg2">' + [7, 30, 90].map(function (b) {
          return '<button type="button" data-opt="keep" data-v="' + b + '"' + (S.keep === b ? ' class="is-on"' : '') + '>' + b + ' 天</button>';
        }).join('') + '</div></div></div>' +
      '<div class="srow"><div style="flex:1"><div class="sl">数据库路径</div><div class="sd" style="margin-bottom:8px">只读展示，数据全部保存在本机</div>' +
        '<div class="path">%APPDATA%/HandPulse/data.db</div></div>' +
        '<div class="sc"><button type="button" class="ghost sm" id="openDir">打开目录</button></div></div>' +
      '<div class="srow"><div><div class="sl">导出全部数据</div><div class="sd">导出当前全部记录，CSV 与 JSON 均可</div></div>' +
        '<div class="sc"><button type="button" class="ghost sm" data-act="csv">CSV</button><button type="button" class="ghost sm" data-act="json">JSON</button></div></div>' +
      '<div class="srow"><div><div class="sl">清空全部数据</div><div class="sd">删除后不可恢复</div></div>' +
        '<div class="sc"><button type="button" class="danger" id="dangerBtn">清空全部数据</button></div></div>' +
      '<div class="confirm" id="confirmBox" data-on="0">' +
        '<div class="cf">输入 DELETE 以确认清空全部数据。</div>' +
        '<div class="crow"><input id="delInput" type="text" autocomplete="off" spellcheck="false" placeholder="DELETE" aria-label="输入 DELETE 确认">' +
        '<button type="button" id="delCancel">取消</button><button type="button" class="dn" id="delOk" disabled>确认清空</button></div>' +
        (S.cleared ? '<div class="cf" style="margin-top:10px">数据已清空（原型演示，刷新页面可恢复）。</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="group glass" style="left:820px;top:212px;width:596px">' +
      '<div class="gh2">关于</div>' +
      '<div class="kv" style="padding-top:4px"><span>版本</span><b>0.4.2 · 原型</b></div>' +
      '<div class="kv"><span>数据 schema</span><b>3</b></div>' +
      '<div class="kv" style="padding-bottom:16px"><span>采集内核</span><b>HandPulse Core 0.4.2</b></div>' +
    '</div>' +
    '<div class="group glass" style="left:820px;top:486px;width:596px">' +
      '<div class="gh2">隐私说明</div>' +
      '<p class="priv">手脉只记录你按下<b>哪个物理键</b>、<b>按了多少次</b>、<b>鼠标移动了多远</b>。它不记录你输入了什么字，不读取窗口标题，不截屏，不联网。你可以随时在设置里暂停记录或清空全部数据。删除后不可恢复。采集内核 HandPulse Core 的源码公开，你可以自行验证上述承诺。</p>' +
    '</div>' +
    '<div class="group glass" style="left:820px;top:368px;width:596px">' +
      '<div class="gh2">采集状态</div>' +
      '<div class="srow" style="border-top:0;padding-top:2px;padding-bottom:14px"><div><div class="sl" style="display:flex;align-items:center;gap:8px"><span class="dot"></span>' +
        (S.paused ? '已暂停' : S.capture ? '运行中' : '已关闭') + '</div><div class="sd">今日已记录 21 小时 43 分　采样 ' + S.bucket + ' 秒</div></div>' +
        '<div class="sc"><button type="button" class="ghost sm" id="sPause">' + (S.paused ? '恢复记录' : '暂停记录') + '</button></div></div>' +
    '</div>';
}
function mountSettings() {
  var d = $('#dangerBtn'), box = $('#confirmBox'), inp = $('#delInput'), ok = $('#delOk'), cancel = $('#delCancel');
  if (d) d.addEventListener('click', function () { box.setAttribute('data-on', '1'); inp.focus(); });
  if (inp) inp.addEventListener('input', function () { ok.disabled = inp.value.trim() !== 'DELETE'; });
  if (cancel) cancel.addEventListener('click', function () { box.setAttribute('data-on', '0'); inp.value = ''; ok.disabled = true; });
  if (ok) ok.addEventListener('click', function () {
    S.cleared = true; TROWS = null; closePop();
    toast('已清空全部数据（原型仅界面演示）');
    render();
  });
  var od = $('#openDir');
  if (od) od.addEventListener('click', function () { toast('打开目录占位：%APPDATA%/HandPulse'); });
  var sp = $('#sPause');
  if (sp) sp.addEventListener('click', function () { togglePause(); });
}

/* ---------------- toast ---------------- */
var toastT = null;
function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function () { t.hidden = true; }, 3200);
}

/* ---------------- render ---------------- */
function pageHTML() {
  if (S.route === 'keyboard') return viewKeyboard();
  if (S.route === 'mouse') return viewMouse();
  if (S.route === 'stats') return viewStats();
  return viewSettings();
}
function mount() {
  if (S.route === 'keyboard') mountKeyboard();
  else if (S.route === 'mouse') mountMouse();
  else if (S.route === 'stats') mountStats();
  else mountSettings();
}
function render() {
  document.body.dataset.route = S.route;
  navRI();
  headerText();
  $$('.nav .item').forEach(function (a) {
    if (a.dataset.r === S.route) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  var ind = $('#navInd');
  if (ind) ind.style.transform = 'translateY(' + (ROUTES.indexOf(S.route) * 50) + 'px)';
  layoutKeys();
  paintKeys();
  var v = $('#view');
  v.innerHTML = pageHTML();
  v.classList.remove('enter');
  void v.offsetWidth;
  v.classList.add('enter');
  mount();
  var b = $('#banner');
  b.hidden = !S.paused;
  paintKeys();
}

/* ---------------- events ---------------- */
function togglePause() {
  S.paused = !S.paused;
  if (!S.paused) S.capture = S.capture || true;
  navRI();
  var b = $('#banner');
  b.hidden = !S.paused;
  render();
  toast(S.paused ? '记录已暂停' : '已恢复记录');
}
function route() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  var r = ROUTES.indexOf(h) >= 0 ? h : 'keyboard';
  if (r !== S.route) { S.route = r; S.page = 0; closePop(); }
  render();
}
function init() {
  drawGlow();
  buildKeys();
  layoutKeys();
  paintKeys();
  navRI();
  headerText();
  document.body.dataset.route = S.route;
  if (!location.hash) location.hash = '#/keyboard';
  route();
  setInterval(live, 100);
  var pb = $('#pauseBtn');
  if (pb) pb.addEventListener('click', togglePause);
  var rb = $('#resumeBtn');
  if (rb) rb.addEventListener('click', togglePause);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePop();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#pop') && !e.target.closest('.key') && !e.target.closest('.trow') && !e.target.closest('.chip')) closePop();
  });
  var view = $('#view');
  view.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-seg]');
    if (btn) {
      var name = btn.dataset.seg, val = btn.dataset.v;
      if (name === 'mode') S.mode = val;
      else if (name === 'layout') { S.layout = +val; drawGlow(); }
      else if (name === 'range') S.range = val;
      else if (name === 'layer') S.layer = val;
      else if (name === 'metric') S.metric = val;
      else if (name === 'srange') S.srange = val;
      else if (name === 'hist') S.hist = val;
      else if (name === 'heat') S.heatTab = val;
      render();
      return;
    }
    var row = e.target.closest('.trow, .chip');
    if (row) { pinKey(row.dataset.key); return; }
    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.dataset.act;
      if (a === 'prev') { S.page = Math.max(0, S.page - 1); render(); }
      else if (a === 'next') { S.page = S.page + 1; render(); }
      else if (a === 'csv' || a === 'json') toast('导出占位：原型不写文件');
      return;
    }
    var sw = e.target.closest('[data-sw]');
    if (sw) {
      var on = sw.getAttribute('aria-checked') === 'true';
      sw.setAttribute('aria-checked', on ? 'false' : 'true');
      if (sw.dataset.sw === 'capture') {
        S.capture = !on;
        if (!S.capture) { S.paused = true; }
        toast(S.capture ? '采集已开启' : '采集已关闭，停止写入新数据');
      } else if (sw.dataset.sw === 'autostart') {
        S.autostart = !on;
        toast(S.autostart ? '已设为开机自启' : '已取消开机自启');
      }
      navRI();
      if (S.route === 'keyboard') { var st = $('#stTxt'); if (st) st.textContent = S.paused ? '已暂停' : S.capture ? '运行中' : '已关闭'; }
      var b = $('#banner'); b.hidden = !S.paused;
      var pb2 = $('#pauseBtn'); if (pb2) pb2.textContent = S.paused ? '已暂停' : '暂停';
      return;
    }
    var opt = e.target.closest('[data-opt]');
    if (opt) {
      var kind = opt.dataset.opt, v = +opt.dataset.v;
      if (kind === 'bucket') S.bucket = v; else S.keep = v;
      render();
      return;
    }
    if (e.target.closest('#resetView')) return;
  });
  window.addEventListener('hashchange', route);
  var s = Math.min(window.innerWidth / 1440, window.innerHeight / 900, 1);
  document.documentElement.style.setProperty('--s', String(s));
  window.addEventListener('resize', function () {
    var s2 = Math.min(window.innerWidth / 1440, window.innerHeight / 900, 1);
    document.documentElement.style.setProperty('--s', String(s2));
  });
}
init();
})();

</script>
</body>
