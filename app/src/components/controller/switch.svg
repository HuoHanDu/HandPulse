<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <!-- HandPulse · Switch Joy-Con（重画完成）
       01 壳体 / 02 肩键 / 03 左键区 / 04 右键区 + 滑轨 -->
  <path d="M75,57 C75,37 87,25 107,25 L145,25 L145,225 L107,225 C87,225 75,213 75,193 Z" fill="#0b6574"/>
  <path d="M325,57 C325,37 313,25 293,25 L255,25 L255,225 L293,225 C313,225 325,213 325,193 Z" fill="#8d3933"/>

  <g stroke="#3c434e" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M70,64 C70,40 85,21 110,21"/><path d="M116,21 L141,21"/><path d="M330,64 C330,40 315,21 290,21"/><path d="M284,21 L259,21"/>
  </g>

  <!-- ZL / ZR：Joy-Con 顶部内侧的肩键本体，沿圆角切线方向摆在 88,40 / 312,40 -->
  <g fill="#3c434e" stroke="#1a1f26" stroke-width="1.2">
    <rect x="78" y="36.25" width="20" height="7.5" rx="3.75" transform="rotate(-48 88 40)"/>
    <rect x="302" y="36.25" width="20" height="7.5" rx="3.75" transform="rotate(48 312 40)"/>
  </g>

  <!-- 滑轨（内侧边） -->
  <rect x="141" y="35" width="4" height="180" fill="#141a20" opacity=".55"/><rect x="141" y="65" width="4" height="40" rx="2" fill="#303640"/><rect x="141" y="145" width="4" height="40" rx="2" fill="#303640"/>
  <rect x="255" y="35" width="4" height="180" fill="#141a20" opacity=".55"/><rect x="255" y="65" width="4" height="40" rx="2" fill="#303640"/><rect x="255" y="145" width="4" height="40" rx="2" fill="#303640"/>

  <!-- 左键区 -->
  <circle cx="110" cy="85" r="18" fill="#111419" stroke="#343b45" stroke-width="2"/><circle cx="110" cy="85" r="14" fill="#3c434e" stroke="#161a20" stroke-width="2"/><circle cx="110" cy="85" r="10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <g fill="#3c434e"><circle cx="110" cy="138" r="7"/><circle cx="93" cy="155" r="7"/><circle cx="127" cy="155" r="7"/><circle cx="110" cy="172" r="7"/></g><rect x="120" y="195" width="10" height="10" rx="2" fill="#3c434e"/><rect x="119" y="43" width="12" height="4" rx="1" fill="#3c434e"/>

  <!-- 右键区：ABXY（A上/B右/X左/Y下）+ 加号 + 摇杆 + Home -->
  <g fill="#3c434e"><circle cx="290" cy="68" r="7"/><circle cx="307" cy="85" r="7"/><circle cx="273" cy="85" r="7"/><circle cx="290" cy="102" r="7"/></g><g font-family="Inter, 'Noto Sans SC', system-ui, sans-serif" font-size="6.4" font-weight="800" fill="#dfe6ef" text-anchor="middle"><text x="290" y="70.4">A</text><text x="307" y="87.4">B</text><text x="273" y="87.4">X</text><text x="290" y="104.4">Y</text></g>
  <rect x="269" y="43" width="12" height="4" rx="1" fill="#3c434e"/><rect x="273" y="39" width="4" height="12" rx="1" fill="#3c434e"/>
  <circle cx="290" cy="155" r="18" fill="#111419" stroke="#343b45" stroke-width="2"/><circle cx="290" cy="155" r="14" fill="#3c434e" stroke="#161a20" stroke-width="2"/><circle cx="290" cy="155" r="10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="275" cy="200" r="7" fill="#3c434e"/>
</svg>
